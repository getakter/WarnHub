{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-1"><i class="bi bi-broadcast-pin text-danger"></i> {{ product_name }}</h1>
    <p class="text-secondary small">{{ product_tagline }} · Practical Action Bangladesh</p>
    {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="u">Username</label><input id="u" name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="p">Password</label><input id="p" type="password" name="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Log in</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
